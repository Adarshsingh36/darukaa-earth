[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends() in defaults is the standard, intended pattern

[tool.ruff.lint.isort]
known-first-party = ["app"]
